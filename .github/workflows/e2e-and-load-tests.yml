name: CitizenAware E2E & Load Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================================
  # JOB 1: Selenium Web E2E Testing & Excel Report Generation
  # ==========================================================================
  selenium-web-tests:
    name: 🌐 Selenium Web E2E Tests & Excel Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl aiohttp
          if [ -f project/package.json ]; then cd project && npm ci || npm install; fi

      - name: Run Selenium E2E Web Tests
        env:
          TEST_BASE_URL: 'http://localhost:8081/auth/login'
        run: |
          node selenium-tests/tests/login-tests.js || true

      - name: Generate Selenium Excel Test Report (315 Cases)
        run: |
          python selenium-tests/scripts/generate_excel_cases.py

      - name: Upload Selenium Web Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-excel-report
          path: |
            selenium-tests/reports/Login_E2E_Test_Report_300_Cases.xlsx
            selenium-tests/login-test-summary-and-details.xlsx
          retention-days: 30

  # ==========================================================================
  # JOB 2: Appium Mobile E2E Testing & Excel Report Generation
  # ==========================================================================
  appium-mobile-tests:
    name: 📱 Appium Mobile E2E Tests & Excel Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl aiohttp

      - name: Run Appium Mobile E2E Test Suite
        run: |
          node appium-tests/appium-tests.js || true

      - name: Generate Appium Mobile Excel Test Report (315 Cases)
        run: |
          python appium-tests/scripts/generate_appium_excel.py

      - name: Upload Appium Mobile Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-excel-report
          path: |
            appium-tests/reports/Appium_Mobile_E2E_Test_Report_300_Cases.xlsx
            appium-tests/appium-mobile-test-summary-and-details.xlsx
          retention-days: 30

  # ==========================================================================
  # JOB 3: Baseline Load & Performance Testing (100 VUs / 60s)
  # ==========================================================================
  baseline-load-tests:
    name: ⚡ Baseline Load Test (100 VUs / 60s) & Excel Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Load Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp openpyxl

      - name: Run 100 VU / 60-Second Load Test Engine
        run: |
          python load-tests/baseline_load_test.py

      - name: Generate Baseline Load Test Excel Report
        run: |
          python load-tests/generate_load_test_excel.py

      - name: Upload Load Test Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-load-test-excel-report
          path: |
            load-tests/reports/Baseline_Load_Test_Results.xlsx
            load-tests/Baseline_Load_Test_Results.xlsx
            load-tests/reports/Baseline_Load_Test_Report.md
          retention-days: 30

  # ==========================================================================
  # JOB 4: Master Consolidation & All Test Excel Artifacts Bundle
  # ==========================================================================
  master-excel-bundle:
    name: 📊 Master Consolidated Excel Report (All 645 Cases)
    needs: [selenium-web-tests, appium-mobile-tests, baseline-load-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Openpyxl Dependency
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl aiohttp

      - name: Generate Master Consolidated Excel Workbook (645 Test Cases)
        run: |
          python generate_master_excel.py

      - name: Upload Master Consolidated Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-consolidated-excel-report
          path: |
            Master_All_Test_Cases_Report.xlsx
            ALL_TEST_CASES_MASTER.xlsx
          retention-days: 30

      - name: Upload Complete All 4 Test Excel Reports Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ALL-4-TEST-EXCEL-REPORTS-BUNDLE
          path: |
            Master_All_Test_Cases_Report.xlsx
            ALL_TEST_CASES_MASTER.xlsx
            selenium-tests/reports/Login_E2E_Test_Report_300_Cases.xlsx
            appium-tests/reports/Appium_Mobile_E2E_Test_Report_300_Cases.xlsx
            load-tests/reports/Baseline_Load_Test_Results.xlsx
            load-tests/reports/Baseline_Load_Test_Report.md
          retention-days: 30
